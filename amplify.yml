# AWS Amplify Hosting 빌드 설정
#
# ★ baseDirectory 가 dist 다 — Amplify 자동 감지는 build 로 잡는 경우가 있다(CRA 기준).
#   그러면 "빌드는 성공했는데 배포된 사이트가 비어 있는" 상태가 된다.
#
# ★ 화면 주소가 전부 /s/<id> 라서 **SPA 리라이트가 없으면 새로고침이 전부 404** 다.
#   빌드 설정으로는 안 되고 콘솔에서 넣어야 한다 — 아래 docs/DEPLOY.md 참고.
#
# ★ VITE_API_BASE_URL 은 Amplify 콘솔 환경변수로 넣는다. 여기 적지 않는다 —
#   브라우저가 백엔드를 직접 호출하므로 이 값은 빌드 시점에 번들로 굳는다.
#
# ★★ VITE_PUBLIC_BASE_URL 도 같은 자리에 넣는다 — 학부모에게 보내는 공개 주소의 도메인이다.
#   비워 두면 **지금 열려 있는 도메인**을 쓴다. 관리자 화면에서 링크를 만들면
#   `https://admin.d-dlab.link/notice/...` 가 되어 **학부모가 `admin.` 으로 시작하는 링크**를
#   받는다 — 피싱으로 의심받는다.
#   ⚠️ 알림톡 버튼 주소는 **승인되면 못 바꾼다**(바꾸려면 재심사다). 도메인을 먼저 정하고
#      이 값을 넣은 뒤에 링크를 만들어야 한다.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
