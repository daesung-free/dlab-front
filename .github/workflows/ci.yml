# 배포 전 검사.
#
# ★ 이 워크플로가 있는 이유. 2026-09-09 에 내부 요구사항 데이터(오픈이슈 42건 —
#   거래처 협상 상태·계약 종료 시점)가 프로덕션 번들에 들어간 채로 배포 직전까지 갔다.
#   사람이 매번 grep 해서 잡을 일이 아니다.
#
# ★ Amplify 는 이 검사와 **무관하게** 자기가 빌드해서 배포한다. 통과해야만 배포되게
#   하려면 레포 Settings → Branches 에서 main 브랜치 보호 규칙에 아래 job 을
#   **필수 상태 검사(required status check)** 로 지정해야 한다.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 타입 오류는 빌드를 통과할 수 있다(Vite 는 타입 검사를 안 한다) — 따로 본다
      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 빌드
        run: npm run build

      # ★ 핵심. 빌드가 성공해도 산출물에 내부 문서가 섞였으면 여기서 막는다
      - name: 산출물에 내부 문서가 섞였는지 검사
        run: node scripts/check-bundle.mjs
