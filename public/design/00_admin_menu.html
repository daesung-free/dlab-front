<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DLab 통합관리 · 전체 메뉴 구성 (IA)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#212934; --ink-2:#3F4753; --muted:#8B94A3; --line:#ECEEF1; --line-2:#F1F3F6;
    --bg:#EDF0F4; --card:#ffffff;
    --mint:#0E9E8E; --mint-d:#0b8073; --mint-b:#16B9A8; --mint-wash:#E7F6F3; --mint-soft:#F2FBFA;
    --amber:#E8920F; --amber-wash:#FEF1E2;
    --red:#E0533D; --red-wash:#FBEBE8; --green:#2E9E5B; --green-wash:#EAF7EF;
    --violet:#6C5CE0; --violet-wash:#EEEBFB; --blue:#3B6FE0; --blue-wash:#EAF1FF;
    --shadow:0 1px 3px rgba(20,30,50,.05); --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard",-apple-system,sans-serif;background:var(--bg);color:var(--ink);
    font-size:14px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* ===== Top category nav ===== */
  .topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:6px;
    background:#fff;border-bottom:1px solid var(--line);padding:0 18px;height:60px}
  .topnav .brand{display:flex;align-items:center;gap:9px;padding-right:16px;margin-right:4px;border-right:1px solid var(--line)}
  .topnav .brand .logo{font-weight:800;font-size:21px;color:var(--mint);letter-spacing:-.03em}
  .topnav .brand .logo b{font-size:10px;vertical-align:top;font-weight:800}
  .topnav .brand .txt b{color:var(--ink);font-size:13px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
  .topnav .brand .txt span{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
  .cat-tabs{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
  .cat-tabs::-webkit-scrollbar{display:none}
  .cat-tab{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;font-size:13px;
    font-weight:600;color:var(--ink-2);white-space:nowrap;cursor:pointer;border:none;background:none;font-family:inherit}
  .cat-tab .ico{color:var(--muted);display:flex}
  .cat-tab:hover{background:var(--bg)}
  .cat-tab.on{background:var(--mint-wash);color:var(--mint-d)}
  .cat-tab.on .ico{color:var(--mint-d)}
  .topnav .who{display:flex;align-items:center;gap:9px;padding-left:14px;margin-left:4px;border-left:1px solid var(--line);white-space:nowrap}
  .topnav .who .av{width:30px;height:30px;border-radius:9px;background:var(--mint-wash);color:var(--mint-d);
    display:grid;place-items:center;font-weight:700;font-size:12px}
  .topnav .who .wt b{font-size:12px;font-weight:700;color:var(--ink);display:block;line-height:1.2}
  .topnav .who .wt span{font-size:10.5px;color:var(--muted)}

  .wrap{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 60px)}

  /* ===== Sub sidebar ===== */
  .side{background:#fff;padding:18px 14px;border-right:1px solid var(--line);
    position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
  .side-cat{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;color:var(--ink);
    letter-spacing:-.02em;padding:2px 8px 4px}
  .side-cat .ico{color:var(--mint-d);display:flex}
  .side-desc{font-size:11.5px;color:var(--muted);padding:0 8px 12px;line-height:1.5;border-bottom:1px solid var(--line-2);margin-bottom:10px}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;color:var(--ink-2);
    font-size:13px;font-weight:500;margin-bottom:2px;cursor:pointer}
  .nav a .ico{color:var(--muted);display:flex;flex-shrink:0}
  .nav a .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav a:hover{background:var(--bg)}
  .nav a.on{background:var(--mint-wash);color:var(--mint-d);font-weight:700}
  .nav a.on .ico{color:var(--mint-d)}
  .ph{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:5px;letter-spacing:.02em;flex-shrink:0}
  .ph.p0{background:#E7E9ED;color:var(--ink-2)}
  .ph.p1{background:var(--mint-wash);color:var(--mint-d)}
  .ph.p2{background:var(--blue-wash);color:var(--blue)}
  .ph.p3{background:var(--violet-wash);color:var(--violet)}
  .ph.p4{background:var(--amber-wash);color:var(--amber)}
  .nwdot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0}

  .side-summary{padding:6px 8px}
  .ss-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}
  .ss-row .k{color:var(--muted);font-weight:600}
  .ss-row .v{font-weight:800;color:var(--ink)}
  .legend-block{margin-top:14px;padding:12px;background:var(--bg);border-radius:12px}
  .legend-block .lt{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);margin-bottom:7px}
  .legend-row:last-child{margin-bottom:0}
  .side-foot{margin-top:16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

  /* ===== Main ===== */
  .main{padding:24px 28px 60px;min-width:0}
  .m-head{margin-bottom:20px}
  .m-head .crumb{font-size:12px;color:var(--muted)}
  .m-head .crumb b{color:var(--ink-2);font-weight:600}
  .m-head h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:4px;display:flex;align-items:center;gap:10px}
  .m-head .sub{font-size:13px;color:var(--muted);margin-top:6px;max-width:640px;line-height:1.6}

  /* overview */
  .ov-note{display:flex;gap:12px;align-items:flex-start;background:var(--mint-soft);border:1px solid #BFE6DF;
    border-radius:14px;padding:15px 18px;margin-bottom:22px}
  .ov-note .ic{width:30px;height:30px;border-radius:9px;background:var(--mint);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .ov-note .tt{font-weight:700;font-size:13.5px;color:var(--mint-d);margin-bottom:3px}
  .ov-note .tx{font-size:12.5px;color:var(--ink-2);line-height:1.6}
  .ov-note b{color:var(--mint-d)}

  .ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .ov-cat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 17px;cursor:pointer;border:1px solid transparent}
  .ov-cat:hover{border-color:#D6EFEA;box-shadow:0 4px 14px rgba(20,30,50,.07)}
  .ov-cat-h{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .ov-cat-h .ic{width:30px;height:30px;border-radius:9px;background:var(--mint-wash);color:var(--mint-d);display:grid;place-items:center;flex-shrink:0}
  .ov-cat-h .nm{font-size:15px;font-weight:800;letter-spacing:-.02em}
  .ov-cat-h .ct{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 9px;border-radius:11px}
  .ov-cat .cd{font-size:11.5px;color:var(--muted);margin-bottom:11px;line-height:1.45;min-height:32px}
  .ov-items{display:flex;flex-direction:column;gap:5px}
  .ov-item{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);padding:4px 0}
  .ov-item .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .ov-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ov-item .mk{font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px}
  .ov-item .mk.cur{background:var(--green-wash);color:var(--green)}
  .ov-item .mk.new{background:var(--amber-wash);color:var(--amber)}

  /* category cards */
  .legend-inline{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:18px;font-size:12px;color:var(--muted)}
  .legend-inline .li{display:flex;align-items:center;gap:6px}
  .legend-inline .li b{color:var(--ink-2)}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .scard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 17px 15px;border:1.5px solid transparent;transition:box-shadow .15s,border-color .15s}
  .scard.flash{border-color:var(--mint);box-shadow:0 6px 20px rgba(14,105,95,.16)}
  .scard-h{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .scard-h .sc-ic{width:34px;height:34px;border-radius:10px;background:var(--mint-wash);color:var(--mint-d);display:grid;place-items:center;flex-shrink:0}
  .scard-h .sc-t{font-size:15px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0}
  .sc-marks{display:flex;gap:6px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
  .mk{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
  .mk.cur{background:var(--green-wash);color:var(--green)}
  .mk.new{background:var(--amber-wash);color:var(--amber)}
  .mk-ph{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px}
  .sc-desc{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:11px}
  .sc-feats{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .sc-feats li{font-size:12px;color:var(--muted);padding-left:17px;position:relative;line-height:1.45}
  .sc-feats li::before{content:"";position:absolute;left:2px;top:6px;width:6px;height:6px;border-radius:2px;background:var(--mint-b)}
  .sc-open{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mint-d);
    background:var(--mint-wash);padding:7px 13px;border-radius:9px}
  .sc-open:hover{background:#D6EFEA}
  .sc-ref{font-size:11px;color:var(--muted);font-weight:600}

  @media(max-width:1180px){.ov-grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topnav">
    <div class="brand">
      <div class="logo">D<b>'</b>Lab</div>

    </div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="who">
      <div class="av">관</div>
      <div class="wt"><b>전체 메뉴</b><span>마스터 뷰 · 全 권한</span></div>
    </div>
  </header>

  <div class="wrap">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

        <div class="sc-desc">${i.desc}</div>
        <ul class="sc-feats">${i.feats.map(f=>`<li>${f}</li>`).join('')}</ul>
        ${i.href?`<a class="sc-open" href="${i.href}"><i data-lucide="external-link" width="14" height="14"></i> 화면 열기</a>`:`<span class="sc-ref">화면 설계 예정 · ${PHASE[i.phase].name}</span>`}
      </div>`;
    });
    html += `</div>`;
    m.innerHTML = html;
    // fix p0 phase pill bg
    m.querySelectorAll('.mk-ph.p0').forEach(e=>{e.style.background='#E7E9ED';e.style.color='#3F4753';});
  }
}

let flashTimer=null;
function flashCard(idx){
  const card = document.querySelector(`.scard[data-idx="${idx}"]`);
  if(!card) return;
  document.querySelectorAll('.scard.flash').forEach(c=>c.classList.remove('flash'));
  card.classList.add('flash');
  const top = card.getBoundingClientRect().top + window.scrollY - 120;
  window.scrollTo({top, behavior:'smooth'});
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>card.classList.remove('flash'),1600);
}

function renderAll(){
  renderTabs(); renderSide(); renderMain();
  window.scrollTo({top:0});
  lucide.createIcons();
}
renderAll();
</script>
